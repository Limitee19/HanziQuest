<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="redChopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Seal -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#redChopGrad)" filter="url(#softGlow)" />
  
  <!-- Subtle Inner Border Frame -->
  <rect x="14" y="14" width="100" height="100" rx="20" ry="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" />
  
  <!-- Chinese Character 字 (Zi - Character / Hanzi) -->
  <text x="64" y="84" font-family="'Noto Serif SC', 'KaiTi', 'SimSun', 'STKaiti', serif" font-weight="900" font-size="70" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">字</text>
</svg>
